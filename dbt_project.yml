name: 'fea_challange'
version: '1.0.0'
config-version: 2

profile: 'fea_challange'

dbt-cloud:
  project-id: 70506183156679

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  fea_challange:
    # Camada raw: tabelas já materializadas pelo EL (scripts/load_raw_to_databricks.py)
    # em adventureworks.raw. O dbt declara-as como sources e transforma a partir daqui.
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["mart"]
