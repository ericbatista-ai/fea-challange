version: 2

models:
  - name: dim_date
    description: >
      Date dimension generated with dbt_utils.date_spine (2010-01-01
      through 2014-12-31). Supports sales slicing by day, month, and year
      (questions a–e). Join from fact_sales on order_date_fk = date_pk
      (yyyyMMdd) or date_day.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [date_pk]
    columns:
      - name: date_day
        description: Calendar date (grain of the dimension).
        data_type: date
        tests:
          - unique
          - not_null

      - name: date_pk
        description: Integer key yyyyMMdd (e.g. 20110531) for easy joins.
        data_type: int
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: calendar_year
        description: Four-digit year.
        data_type: int
        tests:
          - not_null

      - name: calendar_month
        description: Month number 1–12.
        data_type: int
        tests:
          - not_null

      - name: calendar_day
        description: Day of month 1–31.
        data_type: int

      - name: calendar_quarter
        description: Quarter 1–4.
        data_type: int

      - name: day_of_week
        description: Day of week number from the warehouse (Spark dayofweek).
        data_type: int

      - name: day_name
        description: Full weekday name (e.g. Monday).
        data_type: string

      - name: month_name_short
        description: Abbreviated month name (e.g. Jan).
        data_type: string

      - name: month_name
        description: Full month name (e.g. January).
        data_type: string

      - name: year_month
        description: Year-month label yyyy-MM for time-series charts.
        data_type: string

      - name: month_start_date
        description: First day of the month.
        data_type: date

      - name: month_end_date
        description: Last day of the month.
        data_type: date

      - name: is_weekend
        description: True when the date falls on Saturday or Sunday.
        data_type: boolean
        tests:
          - not_null
