version: 2

models:
  - name: dim_customer
    description: Customer dimension — one row per sales customer.
    config:
      contract:
        enforced: false
    constraints:
      - type: primary_key
        columns: [customer_pk]
    columns:
      - name: customer_pk
        description: Natural key from sales.customer.
        data_type: int
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: customer_type
        description: person | store | store_contact | unknown
        data_type: string
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['person', 'store', 'store_contact', 'unknown']

      - name: territory_fk
        description: foreign key to join with dim_territory
        data_type: int
        tests:
          - not_null