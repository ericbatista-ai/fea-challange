version: 2

models:
  - name: dim_salesperson
    description: >
      Salesperson dimension — one row per sales.salesperson.
      Name from person.person; HR attributes from employee; current
      department denormalized from employeedepartmenthistory + department
      (no separate dim_department). Use hire_date to compare tenure vs sales.
      Join from fact_sales.sales_person_fk (nullable when no rep assigned).
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [salesperson_pk]
    columns:
      - name: salesperson_pk
        description: Natural key (BusinessEntityID).
        data_type: int
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: salesperson_name
        description: Full name from person.person.
        data_type: string

      - name: salesperson_first_name
        description: First name from person.person.
        data_type: string

      - name: salesperson_last_name
        description: Last name from person.person.
        data_type: string

      - name: job_title
        description: Job title from humanresources.employee.
        data_type: string

      - name: gender
        description: Gender from humanresources.employee (M/F).
        data_type: string

      - name: hire_date
        description: Hire date — use for tenure vs sales performance.
        data_type: date

      - name: marital_status
        description: Marital status from humanresources.employee.
        data_type: string

      - name: department_fk
        description: Current department id (denormalized; not a dim).
        data_type: int

      - name: department_name
        description: Current department name (denormalized onto this dim).
        data_type: string

      - name: department_group_name
        description: Department group (e.g. Sales and Marketing).
        data_type: string

      - name: territory_fk
        description: Sales territory assigned to the salesperson (nullable).
        data_type: int

      - name: sales_quota
        description: Sales quota from source.
        data_type: decimal(19, 4)

      - name: bonus
        description: Bonus amount from source.
        data_type: decimal(19, 4)

      - name: commission_pct
        description: Commission percentage from source.
        data_type: decimal(10, 4)

      - name: sales_ytd
        description: Sales year-to-date from source (OLTP snapshot attribute).
        data_type: decimal(19, 4)

      - name: sales_last_year
        description: Sales last year from source (OLTP snapshot attribute).
        data_type: decimal(19, 4)

      - name: salesperson_modified_at
        description: Last modification timestamp from sales.salesperson.
        data_type: timestamp
