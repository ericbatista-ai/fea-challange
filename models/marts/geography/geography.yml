version: 2

models:
  - name: dim_geography
    description: >
      Geography dimension at city + state/province + country grain.
      Built from distinct locations in person.address. Use geography_pk
      from dim_address (or facts) to join location attributes.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [geography_pk]
    columns:
      - name: geography_pk
        description: >
          Surrogate key — md5 of city + state_province_id + country_region_code.
        data_type: string
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null

      - name: city
        description: City name from person.address.
        data_type: string
        tests:
          - not_null

      - name: state_province_fk
        description: Natural key to person.stateprovince.
        data_type: int
        tests:
          - not_null

      - name: state_province_code
        description: State/province code (e.g. WA, CA).
        data_type: string

      - name: state_province_name
        description: State/province display name.
        data_type: string

      - name: country_region_code
        description: Country/region code (e.g. US, GB).
        data_type: string
        tests:
          - not_null

      - name: country_region_name
        description: Country/region display name.
        data_type: string
