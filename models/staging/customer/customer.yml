version: 2

models:
  - name: stg_sales_customer
    description: >
      Staging layer for sales.customer. Cleans column names and exposes
      raw fields for downstream intermediate/mart models.
    columns:
      - name: customer_pk
        description: Primary key of the customer.
        tests:
          - unique
          - not_null
      - name: territory_fk
        description: Territory ID assigned to the customer account.
        tests:
          - not_null

  - name: stg_person_person
    description: >
      Staging layer for person.person. Individual people that can be
      linked to a sales customer via person_fk.
    columns:
      - name: person_business_entity_pk
        description: Business Entity ID of the person (PK).
        tests:
          - not_null
          - unique

  - name: stg_sales_store
    description: >
      Staging layer for sales.store. Stores that buy products from
      AdventureWorks to resell.
    columns:
      - name: store_business_entity_pk
        description: Business Entity ID of the store (PK).
        tests:
          - not_null
          - unique
