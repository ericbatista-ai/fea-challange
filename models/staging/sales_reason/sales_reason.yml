version: 2

models:
  - name: stg_sales_salesreason
    description: >
      Staging for sales.salesreason. Reasons associated with sales orders
      (e.g. Promotion) for questions a, c, d, f.
    columns:
      - name: sales_reason_pk
        description: Primary key of the sales reason.
        tests:
          - unique
          - not_null
      - name: sales_reason_name
        description: Reason display name (e.g. Promotion, Price, Quality).
        tests:
          - not_null

  - name: stg_sales_salesorderheadersalesreason
    description: >
      Staging for sales.salesorderheadersalesreason. Many-to-many link
      between sales orders and sales reasons (source for the bridge).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_fk
              - sales_reason_fk
    columns:
      - name: sales_order_fk
        description: Sales order ID (header).
        tests:
          - not_null
      - name: sales_reason_fk
        description: Sales reason ID.
        tests:
          - not_null
